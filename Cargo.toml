[workspace]
members = ["crates/git-twig", "crates/twig-bench"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/leostera/git-twig"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

name: Bug report
description: Report incorrect checkout contents, CLI errors, or unexpected fallback.
body:
  - type: markdown
    attributes:
      value: |
        Help us reproduce the behavior without changing your original repository.
        This issue is public: redact credentials, private code, remote URLs, and identifying paths.
        Unknown details are OK—say what you could not collect. Use the performance form for timing or disk-use comparisons.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Include exact errors. For checkout bugs, describe wrong bytes, modes, symlinks, missing files, or unexpected source changes.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact commands and reproduction steps
      description: Include the working directory, starting state, revision, and complete arguments. A minimal sanitized reproduction is welcome.
      placeholder: |
        Starting from a fresh clone / existing checkout:
        git twig new --detach ../unused-destination HEAD
        Expected:
        Actual:
      render: shell
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and installation
      description: Paste git twig --version, git --version, and how Twig was installed (Homebrew, Cargo, release archive, or source). For source builds include the full source commit, rustc --version, build command, and custom build flags. If the CLI cannot run, paste that failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and hardware
      description: Include OS version/build and CPU/architecture; on macOS, sw_vers and uname -m are useful. State whether this is a host, VM, or container.
      placeholder: "macOS version/build, Apple chip or Intel; or Linux distribution/kernel and architecture"
    validations:
      required: true
  - type: dropdown
    id: filesystem
    attributes:
      label: Filesystem used by the source and destination
      options:
        - APFS
        - Btrfs
        - Reflink-enabled XFS
        - Other filesystem
        - Different filesystems or volumes
        - Unknown
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: Repository, attributes, and checkout configuration
      description: Public URL and full commit if shareable; otherwise sanitized details. Include relevant .gitattributes, nested/info/global attributes, submodules/LFS, sparse checkout, dirty/staged files, and checkout-related configuration or hooks. Do not paste a full config/environment dump or filter credentials. Do not change attributes just to force CoW.
  - type: textarea
    id: storage
    attributes:
      label: Storage layout
      description: Are source, destination, and common Git metadata on the same volume? Mention external/network/cloud-synced storage, case sensitivity, or special ACLs/permissions if relevant. Redact identifying paths.
  - type: textarea
    id: trace
    attributes:
      label: Trace or failure output
      description: On a disposable reproduction or with a new unused destination, rerun with TWIG_TRACE=1. For example, env TWIG_TRACE=1 git twig new --detach ../unused-destination HEAD. Include output from start to finish. Do not remove existing worktrees to collect it. If rerunning is unsafe or impossible, explain why instead.
      render: text
    validations:
      required: true

name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Keep the binary's glibc baseline compatible with supported LTS hosts.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          cargo test --workspace --locked
          cargo build --release --locked -p git-twig --target ${{ matrix.target }}
          mkdir -p package dist
          cp target/${{ matrix.target }}/release/git-twig LICENSE README.md CHANGELOG.md crates/git-twig/man/git-twig.1 package/
          tar -czf dist/git-twig-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum *.tar.gz) > dist/SHA256SUMS
          python3 scripts/release-formula.py "${GITHUB_REF_NAME#v}" dist > dist/git-twig.rb
          python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c "formula-${GITHUB_REF_NAME}" origin/main
          cp dist/git-twig.rb Formula/git-twig.rb
          git add Formula/git-twig.rb
          git commit -m "chore: update Homebrew formula for $GITHUB_REF_NAME"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
